# Secret scan — security review 24 Nov 2026, SR-20 (row 2026-11-24p).
# This repository is PUBLIC: a pull request from a fork must never run code on one of our own machines.
# So: a GitHub-hosted runner only, read-only token, no secrets, `pull_request` (the plain pull_request trigger only).
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest tests/test_no_credential_in_the_tree.py -q -p no:cacheprovider
